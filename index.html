<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霧島市プレミアム商品券 使えるお店検索</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--txt:#222;--muted:#666;--line:#e8e1d8;--main:#2c6b4f;--sub:#f1eadf;--warn:#fff4c2;--warnText:#7a4f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}.wrap{max-width:980px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(135deg,#2c6b4f,#5d9477);color:#fff;border-radius:24px;padding:26px 22px;margin:10px 0 18px}.hero h1{font-size:clamp(24px,5vw,38px);line-height:1.25;margin:0 0 8px}.hero p{margin:0;opacity:.92}.rule{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px}.rule strong{color:#b06a00}.filters{position:sticky;top:0;background:rgba(247,246,242,.94);backdrop-filter:blur(8px);padding:12px 0;z-index:10}.filter-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.05)}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px}@media(max-width:820px){.row{grid-template-columns:1fr}.filters{position:static}}input,select{width:100%;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:var(--sub);border-radius:999px;padding:6px 10px;font-size:13px;color:#4d4033;cursor:pointer}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 2px;color:var(--muted);font-size:14px}.list{display:grid;gap:10px}.shop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.shop h2{font-size:17px;margin:0 0 5px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#edf4ef;color:#255842;border-radius:999px;padding:3px 8px}.tag.area{background:#f4eee5;color:#66513b}.tag.large{background:var(--warn);color:var(--warnText);font-weight:700}.tag.normal{background:#e8f5ed;color:#1f6b3a;font-weight:700}.map{white-space:nowrap;color:var(--main);text-decoration:none;font-weight:700;font-size:13px}.note{color:var(--muted);font-size:13px;margin-top:16px}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero"><h1>霧島市プレミアム商品券<br>使えるお店検索</h1><p>PDF一覧を、エリア・ジャンル・店名で探しやすくした非公式の検索ページです。</p></section>
  <div class="rule"><strong>商品券ルール：</strong>1冊14枚のうち、黄色背景の大規模店舗では7枚まで利用できます。小規模店舗では14枚すべて利用できます。</div>
  <section class="filters"><div class="filter-card"><div class="row"><input id="keyword" type="search" placeholder="店名で検索 例：焼肉、コスモス、温泉"><select id="area"><option value="">全エリア</option></select><select id="genre"><option value="">全ジャンル</option></select><select id="ticket"><option value="">全店舗</option><option value="normal">小規模店舗のみ（14枚使える）</option><option value="large">大規模店舗のみ（7枚まで）</option></select></div><div class="chips" id="quickGenres"></div></div></section>
  <div class="meta"><span id="count">読み込み中...</span><span>令和8年5月27日現在PDFより作成</span></div>
  <main id="shopList" class="list"></main>
  <p class="note">※住所情報はPDFに掲載されていないため、Google検索リンクは店名・霧島市・地区名で検索します。ジャンルは店名からの自動分類のため、誤りがある場合があります。大規模店舗の判定はPDFの黄色背景から抽出しています。</p>
</div>
<script>
let shops=[];
const areaEl=document.getElementById('area'), genreEl=document.getElementById('genre'), ticketEl=document.getElementById('ticket'), keywordEl=document.getElementById('keyword'), listEl=document.getElementById('shopList'), countEl=document.getElementById('count');
fetch('./shops.json').then(r=>r.json()).then(data=>{shops=data;init();render();}).catch(()=>{countEl.textContent='店舗データを読み込めませんでした';});
function init(){
  [...new Set(shops.map(s=>s.area))].forEach(v=>areaEl.insertAdjacentHTML('beforeend',`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
  [...new Set(shops.map(s=>s.genre))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(v=>genreEl.insertAdjacentHTML('beforeend',`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
  ['飲食店','カフェ・スイーツ','スーパー・食品','コンビニ','ドラッグストア・薬局','宿泊・温泉'].forEach(g=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=g;b.onclick=()=>{genreEl.value=g;render();};document.getElementById('quickGenres').appendChild(b);});
  [keywordEl,areaEl,genreEl,ticketEl].forEach(el=>el.addEventListener('input',render));
}
function render(){
  const kw=keywordEl.value.trim().toLowerCase(), area=areaEl.value, genre=genreEl.value, ticket=ticketEl.value;
  const filtered=shops.filter(s=>(!area||s.area===area)&&(!genre||s.genre===genre)&&(!ticket||(ticket==='large'?s.is_large_store:!s.is_large_store))&&(!kw||`${s.name} ${s.area} ${s.genre}`.toLowerCase().includes(kw)));
  const largeCount=shops.filter(s=>s.is_large_store).length;
  countEl.textContent=`${filtered.length}件 / ${shops.length}件（大規模店舗 ${largeCount}件）`;
  if(!filtered.length){listEl.innerHTML='<div class="empty">該当するお店が見つかりませんでした</div>';return;}
  listEl.innerHTML=filtered.map(s=>`<article class="shop"><div><h2>${escapeHtml(s.name)}</h2><div class="tags"><span class="tag area">${escapeHtml(s.area)}</span><span class="tag">${escapeHtml(s.genre)}</span>${s.is_large_store?'<span class="tag large">大規模店舗：共通券のみ</span>':'<span class="tag normal">小規模店舗：14枚利用可</span>'}</div></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(s.map_query)}">地図検索</a></article>`).join('');
}
function escapeHtml(str){return String(str).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
</script>
</body>
</html>
